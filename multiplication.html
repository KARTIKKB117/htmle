
<html>
<body>
<h3>Multiplication Table</h3>
Enter number: <input id="n">
<button onclick="check()">Print</button>
<p id="result"></p>

<script>
function check() {
  let n = Number(document.getElementById("n").value);
  let s = "";

  for (let i = 1; i <= 10; i++) {
    s += n + " x " + i + " = " + (n * i) + "<br>";
  }

  document.getElementById("result").innerHTML = s;
}
</script>
</body>
</html>
